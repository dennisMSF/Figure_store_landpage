[project]
name = "figure-store"
version = "0.1.0"
description = "Tienda web de figuras de anime originales."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",             # Framework web
    "uvicorn[standard]>=0.32",    # Servidor ASGI
    "jinja2>=3.1",                # Plantillas HTML renderizadas en el servidor
    "pydantic-settings>=2.6",     # Configuración tipada desde .env
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=1.0",              # Requerido por fastapi.testclient
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/figure_store"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
